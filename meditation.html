<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSIDIAN — Méditation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --noir: #0a0a0a;
    --noir-2: #0f0f0f;
    --or: #d4a843;
    --or-sombre: #8a6a20;
    --blanc: #f0ebe0;
    --gris: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--noir);
    color: var(--blanc);
    font-family: 'Crimson Text', Georgia, serif;
    overflow: hidden;
    user-select: none;
  }

  /* ─── NAV ─── */
  .nav-back {
    position: fixed;
    top: 28px; left: 32px;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--or-sombre);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.4s, opacity 0.4s;
    z-index: 100;
  }
  .nav-back:hover { color: var(--or); }

  /* ─── SETUP SCREEN ─── */
  #setupScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    z-index: 10;
    transition: opacity 0.8s ease;
  }

  #setupScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .setup-eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--or-sombre);
    text-transform: uppercase;
  }

  .setup-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    color: var(--or);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
  }

  .setup-subtitle {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: rgba(240, 235, 224, 0.4);
    text-align: center;
  }

  /* Duration picker */
  .duration-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gris);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 16px;
  }

  .duration-grid {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-duration {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    font-weight: 600;
    padding: 16px 28px;
    border: 1px solid rgba(212, 168, 67, 0.2);
    background: transparent;
    color: rgba(240, 235, 224, 0.5);
    cursor: pointer;
    transition: all 0.3s ease;
    min-width: 100px;
  }

  .btn-duration:hover,
  .btn-duration.active {
    border-color: var(--or);
    color: var(--or);
    background: rgba(212, 168, 67, 0.05);
  }

  .btn-duration .min-label {
    display: block;
    font-size: 9px;
    letter-spacing: 0.2em;
    opacity: 0.6;
    margin-top: 4px;
    font-weight: 400;
  }

  /* Sound toggle */
  .sound-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .sound-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--gris);
    text-transform: uppercase;
  }

  .toggle-wrap {
    display: flex;
    gap: 8px;
  }

  .btn-toggle {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 6px 16px;
    border: 1px solid rgba(212, 168, 67, 0.2);
    background: transparent;
    color: rgba(240, 235, 224, 0.4);
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-toggle.active {
    border-color: var(--or);
    color: var(--or);
    background: rgba(212, 168, 67, 0.05);
  }

  /* Start button */
  .btn-start {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 18px 56px;
    background: var(--or);
    border: none;
    color: var(--noir);
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
  }

  .btn-start:hover {
    background: #e8c97a;
    letter-spacing: 0.45em;
  }

  /* ─── MEDITATION SCREEN ─── */
  #meditationScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
  }

  #meditationScreen.visible {
    opacity: 1;
    pointer-events: all;
  }

  /* Breathing circle */
  .breath-ring {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    border: 1px solid rgba(212, 168, 67, 0.06);
    animation: breathe 8s ease-in-out infinite;
    pointer-events: none;
  }

  .breath-ring:nth-child(2) {
    width: 280px;
    height: 280px;
    border-color: rgba(212, 168, 67, 0.04);
    animation-delay: -2s;
  }

  .breath-ring:nth-child(3) {
    width: 240px;
    height: 240px;
    border-color: rgba(212, 168, 67, 0.08);
    animation-delay: -4s;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  /* Timer */
  .timer-display {
    font-family: 'Cinzel', serif;
    font-size: clamp(3rem, 8vw, 5.5rem);
    font-weight: 900;
    color: var(--or);
    letter-spacing: 0.05em;
    position: relative;
    z-index: 2;
    text-shadow: 0 0 60px rgba(212, 168, 67, 0.2);
    transition: opacity 0.5s;
  }

  /* Progress arc */
  .progress-ring {
    position: absolute;
    width: 320px;
    height: 320px;
    transform: rotate(-90deg);
    pointer-events: none;
  }

  .progress-ring circle {
    fill: none;
    stroke: rgba(212, 168, 67, 0.15);
    stroke-width: 1;
  }

  .progress-ring .arc {
    stroke: rgba(212, 168, 67, 0.5);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  /* Citation */
  .meditation-quote {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    max-width: 520px;
    width: 90%;
    z-index: 2;
    transition: opacity 1.5s ease;
  }

  .meditation-quote p {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: rgba(240, 235, 224, 0.35);
    line-height: 1.7;
    letter-spacing: 0.02em;
  }

  .meditation-quote .quote-source {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: rgba(212, 168, 67, 0.2);
    text-transform: uppercase;
    margin-top: 12px;
    display: block;
  }

  /* Controls */
  .med-controls {
    position: absolute;
    bottom: 6%;
    display: flex;
    gap: 20px;
    align-items: center;
    z-index: 10;
    transition: opacity 0.4s;
  }

  .btn-med {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 10px 24px;
    border: 1px solid rgba(212, 168, 67, 0.15);
    background: transparent;
    color: rgba(212, 168, 67, 0.4);
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-med:hover {
    border-color: rgba(212, 168, 67, 0.4);
    color: var(--or);
  }

  /* Session indicator */
  .session-info {
    position: absolute;
    top: 28px;
    right: 32px;
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: rgba(212, 168, 67, 0.25);
    text-transform: uppercase;
    z-index: 100;
    text-align: right;
  }

  /* ─── END SCREEN ─── */
  #endScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 20;
  }

  #endScreen.visible {
    opacity: 1;
    pointer-events: all;
  }

  .end-glyph {
    font-family: 'Cinzel', serif;
    font-size: 3rem;
    color: rgba(212, 168, 67, 0.3);
    animation: fadeGlyph 3s ease-in-out infinite;
  }

  @keyframes fadeGlyph {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  .end-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 900;
    color: var(--or);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
  }

  .end-subtitle {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: rgba(240, 235, 224, 0.4);
    text-align: center;
  }

  .end-stats {
    display: flex;
    gap: 48px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .end-stat {
    text-align: center;
  }

  .end-stat-value {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--or);
    display: block;
  }

  .end-stat-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--gris);
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  .end-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }

  .btn-end {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 14px 36px;
    background: transparent;
    border: 1px solid rgba(212, 168, 67, 0.3);
    color: rgba(240, 235, 224, 0.6);
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    display: inline-block;
  }

  .btn-end:hover,
  .btn-end.primary {
    border-color: var(--or);
    color: var(--or);
  }

  .btn-end.primary {
    background: var(--or);
    color: var(--noir);
  }

  .btn-end.primary:hover {
    background: #e8c97a;
    color: var(--noir);
  }

  /* ─── GRAIN ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .btn-duration { padding: 12px 20px; min-width: 80px; }
    .btn-start { padding: 16px 40px; }
    .progress-ring, .breath-ring { width: 260px; height: 260px; }
    .breath-ring:nth-child(2) { width: 220px; height: 220px; }
    .breath-ring:nth-child(3) { width: 190px; height: 190px; }
    .meditation-quote { bottom: 18%; }
  }
</style>
</head>
<body>

<a href="index.html" class="nav-back" id="navBack">← Obsidian</a>

<!-- ─── SETUP ─── -->
<div id="setupScreen">
  <div>
    <p class="setup-eyebrow">Mode Silence</p>
    <h1 class="setup-title">Méditation</h1>
    <p class="setup-subtitle">Entre dans le silence. Laisse les accords agir.</p>
  </div>

  <div>
    <p class="duration-label">Durée</p>
    <div class="duration-grid">
      <button class="btn-duration" data-min="5">5<span class="min-label">minutes</span></button>
      <button class="btn-duration active" data-min="10">10<span class="min-label">minutes</span></button>
      <button class="btn-duration" data-min="20">20<span class="min-label">minutes</span></button>
      <button class="btn-duration" data-min="30">30<span class="min-label">minutes</span></button>
    </div>
  </div>

  <div class="sound-row">
    <span class="sound-label">Son</span>
    <div class="toggle-wrap">
      <button class="btn-toggle active" id="btnSoundOn">Bol tibétain</button>
      <button class="btn-toggle" id="btnSoundOff">Silence total</button>
    </div>
  </div>

  <button class="btn-start" id="btnStart">Commencer</button>
</div>

<!-- ─── MEDITATION ─── -->
<div id="meditationScreen">
  <div class="session-info" id="sessionInfo">—</div>

  <!-- Breathing rings -->
  <div class="breath-ring"></div>
  <div class="breath-ring"></div>
  <div class="breath-ring"></div>

  <!-- Progress SVG -->
  <svg class="progress-ring" id="progressRing" viewBox="0 0 320 320">
    <circle cx="160" cy="160" r="150"/>
    <circle class="arc" id="progressArc" cx="160" cy="160" r="150"
      stroke-dasharray="942"
      stroke-dashoffset="0"/>
  </svg>

  <!-- Timer -->
  <div class="timer-display" id="timerDisplay">10:00</div>

  <!-- Quote -->
  <div class="meditation-quote" id="meditationQuote">
    <p id="quoteText"></p>
    <span class="quote-source" id="quoteSource"></span>
  </div>

  <!-- Controls -->
  <div class="med-controls" id="medControls">
    <button class="btn-med" id="btnPause">Pause</button>
    <button class="btn-med" id="btnStop">Arrêter</button>
  </div>
</div>

<!-- ─── END ─── -->
<div id="endScreen">
  <div class="end-glyph">◈</div>
  <h2 class="end-title">Session accomplie</h2>
  <p class="end-subtitle">Le silence était ta pratique. Le reste suit.</p>
  <div class="end-stats">
    <div class="end-stat">
      <span class="end-stat-value" id="endDuration">—</span>
      <span class="end-stat-label">Durée</span>
    </div>
    <div class="end-stat">
      <span class="end-stat-value" id="endSessions">—</span>
      <span class="end-stat-label">Sessions totales</span>
    </div>
  </div>
  <div class="end-actions">
    <button class="btn-end primary" id="btnRestart">Nouvelle session</button>
    <a class="btn-end" href="index.html">Retour</a>
  </div>
</div>

<script>
// ── Citations de méditation
const QUOTES = [
  { text: "Le silence n'est pas l'absence de bruit. C'est la présence de toi-même.", source: "Morale de Ghost" },
  { text: "Soyez impeccable avec votre parole. Dans le silence, chaque mot prend son poids.", source: "Don Miguel Ruiz" },
  { text: "Ce que les autres pensent de vous ne vous appartient pas. Ce moment vous appartient.", source: "Don Miguel Ruiz" },
  { text: "L'aigle voit de haut. Il n'est pas emporté par ce qui se passe en bas.", source: "Morale de Ghost" },
  { text: "Faites toujours de votre mieux. En ce moment, votre mieux c'est de simplement être.", source: "Don Miguel Ruiz" },
  { text: "Le Guerrier Toltèque ne combat pas le monde. Il se transforme lui-même.", source: "Don Miguel Ruiz" },
  { text: "Observez votre esprit. Ne le jugez pas. Observez seulement.", source: "Morale de Ghost" },
  { text: "Ne supposez rien de ce que vous ressentez. Accueillez-le simplement.", source: "Don Miguel Ruiz" },
  { text: "La force forge dans l'adversité. Le silence est une adversité douce.", source: "Macdubh" },
  { text: "Chaque souffle est un accord avec la vie. Honorez-le.", source: "Morale de Ghost" },
  { text: "Le sceptique intelligent écoute en silence avant de juger.", source: "Don Miguel Ruiz" },
  { text: "Dans le silence, on entend ce que le bruit empêchait de voir.", source: "Morale de Ghost" },
];

// ── State
let selectedMinutes = 10;
let soundEnabled = true;
let totalSeconds = 0;
let remainingSeconds = 0;
let timerInterval = null;
let isPaused = false;
let quoteInterval = null;
let currentQuoteIdx = 0;
let sessionCount = parseInt(localStorage.getItem('obsidian_med_sessions') || '0');
let audioCtx = null;

// ── DOM
const setupScreen      = document.getElementById('setupScreen');
const meditationScreen = document.getElementById('meditationScreen');
const endScreen        = document.getElementById('endScreen');
const timerDisplay     = document.getElementById('timerDisplay');
const progressArc      = document.getElementById('progressArc');
const sessionInfo      = document.getElementById('sessionInfo');
const quoteText        = document.getElementById('quoteText');
const quoteSource      = document.getElementById('quoteSource');
const meditationQuote  = document.getElementById('meditationQuote');
const btnPause         = document.getElementById('btnPause');
const endDuration      = document.getElementById('endDuration');
const endSessions      = document.getElementById('endSessions');

// ── Duration picker
document.querySelectorAll('.btn-duration').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-duration').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMinutes = parseInt(btn.dataset.min);
  });
});

// ── Sound toggle
document.getElementById('btnSoundOn').addEventListener('click', () => {
  soundEnabled = true;
  document.getElementById('btnSoundOn').classList.add('active');
  document.getElementById('btnSoundOff').classList.remove('active');
});
document.getElementById('btnSoundOff').addEventListener('click', () => {
  soundEnabled = false;
  document.getElementById('btnSoundOff').classList.add('active');
  document.getElementById('btnSoundOn').classList.remove('active');
});

// ── Web Audio — bol tibétain synthétique
function initAudio() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

function playBowl(freq = 432, duration = 3) {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.98, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.3);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration);
}

function playEndBell() {
  if (!soundEnabled || !audioCtx) return;
  [0, 0.8, 1.6].forEach((delay, i) => {
    setTimeout(() => playBowl(432 - i * 30, 4), delay * 1000);
  });
}

// ── Format time
function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

// ── Progress arc
const CIRCUMFERENCE = 2 * Math.PI * 150; // r=150

function updateArc() {
  const progress = remainingSeconds / totalSeconds;
  const offset = CIRCUMFERENCE * (1 - progress);
  progressArc.style.strokeDasharray = CIRCUMFERENCE;
  progressArc.style.strokeDashoffset = offset;
}

// ── Quote rotation
function showQuote(idx) {
  meditationQuote.style.opacity = 0;
  setTimeout(() => {
    const q = QUOTES[idx % QUOTES.length];
    quoteText.textContent = q.text;
    quoteSource.textContent = q.source;
    meditationQuote.style.opacity = 1;
  }, 1500);
}

function startQuoteRotation() {
  currentQuoteIdx = Math.floor(Math.random() * QUOTES.length);
  showQuote(currentQuoteIdx);
  quoteInterval = setInterval(() => {
    currentQuoteIdx = (currentQuoteIdx + 1) % QUOTES.length;
    showQuote(currentQuoteIdx);
  }, 30000); // toutes les 30s
}

// ── Start session
document.getElementById('btnStart').addEventListener('click', () => {
  initAudio();
  totalSeconds = selectedMinutes * 60;
  remainingSeconds = totalSeconds;

  timerDisplay.textContent = formatTime(remainingSeconds);
  updateArc();
  sessionInfo.textContent = `${selectedMinutes} min · ${soundEnabled ? 'Bol tibétain' : 'Silence total'}`;

  setupScreen.classList.add('hidden');
  setTimeout(() => {
    meditationScreen.classList.add('visible');
    startTimer();
    startQuoteRotation();
    if (soundEnabled) playBowl(432, 4);
  }, 800);
});

// ── Timer
function startTimer() {
  timerInterval = setInterval(() => {
    if (isPaused) return;
    remainingSeconds--;
    timerDisplay.textContent = formatTime(remainingSeconds);
    updateArc();

    // Son toutes les 5 minutes
    if (remainingSeconds > 0 && remainingSeconds % 300 === 0 && soundEnabled) {
      playBowl(396, 3);
    }

    if (remainingSeconds <= 0) {
      endSession();
    }
  }, 1000);
}

// ── Pause / Resume
btnPause.addEventListener('click', () => {
  isPaused = !isPaused;
  btnPause.textContent = isPaused ? 'Reprendre' : 'Pause';
  timerDisplay.style.opacity = isPaused ? '0.4' : '1';
});

// ── Stop
document.getElementById('btnStop').addEventListener('click', () => {
  if (confirm('Arrêter la session ?')) endSession(true);
});

// ── End session
function endSession(aborted = false) {
  clearInterval(timerInterval);
  clearInterval(quoteInterval);

  if (!aborted) {
    playEndBell();
    sessionCount++;
    localStorage.setItem('obsidian_med_sessions', sessionCount);
  }

  const elapsed = totalSeconds - remainingSeconds;
  const elapsedMin = Math.floor(elapsed / 60);
  const elapsedSec = elapsed % 60;

  endDuration.textContent = `${elapsedMin}:${String(elapsedSec).padStart(2, '0')}`;
  endSessions.textContent = sessionCount;

  meditationScreen.classList.remove('visible');
  setTimeout(() => {
    endScreen.classList.add('visible');
  }, 500);
}

// ── Restart
document.getElementById('btnRestart').addEventListener('click', () => {
  endScreen.classList.remove('visible');
  isPaused = false;
  btnPause.textContent = 'Pause';
  timerDisplay.style.opacity = '1';

  setTimeout(() => {
    setupScreen.style.opacity = '1';
    setupScreen.style.pointerEvents = 'all';
    setupScreen.classList.remove('hidden');
  }, 600);
});
</script>
